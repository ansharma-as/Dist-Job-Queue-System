server:
  port: 8081

spring:
  application:
    name: job-api-service
  datasource:
    url: jdbc:postgresql://localhost:5433/jobqueue
    username: jobuser
    password: jobpassword
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
